name: myforge-dapr-engine

# Self-hosted PostgreSQL for the opt-in `npm run test:postgres` suite.
# Copy .env.example to .env (gitignored) and set POSTGRES_PASSWORD first.
services:
  postgres:
    image: docker.io/library/postgres@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in tools/dapr-engine/.env}
      POSTGRES_DB: receipts
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      # PostgreSQL 18+ images expect the mount at /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receipts"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
