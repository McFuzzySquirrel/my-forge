name: myforge-runtime

# Persistent local runtime. Invoke with an installation-scoped env file created
# by the Forge lifecycle command; never put credentials in this source tree.
services:
  postgres:
    image: docker.io/library/postgres@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      POSTGRES_DB: postgres
      DAPR_DB_PASSWORD: ${DAPR_DB_PASSWORD:?DAPR_DB_PASSWORD is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    cpus: 1.0
    mem_limit: 1g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  placement:
    image: docker.io/daprio/placement:1.18.7
    command:
      - /placement
      - --port
      - "50005"
      - --healthz-port
      - "8080"
      - --enable-metrics=false
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  scheduler:
    image: docker.io/daprio/scheduler:1.18.7
    command:
      - /scheduler
      - --port
      - "50006"
      - --healthz-port
      - "8081"
      - --etcd-data-dir
      - /var/lib/dapr/scheduler
      - --override-broadcast-host-port
      - scheduler:50006
      - --enable-metrics=false
    cpus: 1.0
    mem_limit: 1g
    volumes:
      - scheduler_data:/var/lib/dapr/scheduler
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  daprd:
    image: docker.io/daprio/daprd:1.18.7
    command:
      - /daprd
      - --app-id
      - myforge-engine
      - --resources-path
      - /components
      - --placement-host-address
      - placement:50005
      - --scheduler-host-address
      - scheduler:50006
      - --dapr-grpc-port
      - "50001"
      - --dapr-http-port
      - "3500"
      - --dapr-listen-addresses
      - 0.0.0.0
      - --enable-metrics=false
      - --log-level
      - warn
    cpus: 1.0
    mem_limit: 512m
    environment:
      MYFORGE_STATE_URL: "host=postgres port=5432 user=myforge_dapr password=${DAPR_DB_PASSWORD:?DAPR_DB_PASSWORD is required} dbname=myforge_dapr sslmode=disable"
    volumes:
      - ./components:/components:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
      placement:
        condition: service_started
      scheduler:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  scheduler_data:
